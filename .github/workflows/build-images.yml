# Constrói as imagens do backend e do frontend no GitHub e publica no GHCR.
# Assim o servidor (Easypanel) só baixa as imagens prontas, sem fazer build.
name: Build das imagens

on:
  push:
    branches: [docs/arquitetura-plataforma]
    paths: ["backend/**", "frontend/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ghcr.io/liviamancine/openupexp-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
