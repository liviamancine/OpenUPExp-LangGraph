server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # DNS do Docker: resolve "api" a cada 10 s, para não manter o IP antigo quando a API é recriada
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;          # SSE
    proxy_read_timeout 1h;
  }

  # arquivos com hash no nome podem ficar em cache; o index.html não (senão o navegador mostra versão antiga)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
