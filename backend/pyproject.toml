[project]
name = "openupexp"
version = "0.1.0"
description = "Plataforma OpenUPExp: engenharia de requisitos de explicabilidade com agentes e validação humana"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic",
  "pgvector",
  "pydantic>=2.7",
  "pydantic-settings",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "baml-py==0.226.2",
  "pypdf",
  "pyyaml",
  "jinja2",
  "pyjwt",
  "python-multipart",
  "sse-starlette",
  "typer",
  "httpx",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers", "torch"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
openupexp = "openupexp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openupexp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["openupexp/baml_client", "migrations"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
